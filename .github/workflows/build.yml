name: Build

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: mint-vpn-windows
            target: x86_64-pc-windows-msvc
            ext: nsis,portable

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm deps
        run: npm ci

      # sing-box (the actual VPN engine) is shipped with the app as a Tauri
      # external sidecar binary. Pin a known-good release here so the app
      # always boots with a tested core. The naming convention
      # `sing-box-<rust-target>.exe` is required by Tauri's externalBin
      # mechanism.
      - name: Download sing-box sidecar (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SINGBOX_VERSION: "1.10.7"
        run: |
          $version = $env:SINGBOX_VERSION
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-windows-amd64.zip"
          $dest = "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $tmp = New-TemporaryFile
          Remove-Item $tmp
          $tmpDir = New-Item -ItemType Directory -Path "$($tmp.FullName)-d"
          $zip = Join-Path $tmpDir.FullName "sing-box.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $tmpDir.FullName -Force
          $exe = Get-ChildItem -Path $tmpDir.FullName -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "sing-box.exe not found in archive"; exit 1 }
          # Tauri sidecar lookup: <name>-<rust-target><ext>
          Copy-Item $exe.FullName -Destination "$dest/sing-box-${{ matrix.target }}.exe" -Force
          # wintun.dll required for TUN-mode (future). Ships next to sidecar.
          $wintunUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          $wzip = Join-Path $tmpDir.FullName "wintun.zip"
          Invoke-WebRequest -Uri $wintunUrl -OutFile $wzip -UseBasicParsing
          Expand-Archive -Path $wzip -DestinationPath $tmpDir.FullName -Force
          $dll = Get-ChildItem -Path (Join-Path $tmpDir.FullName "wintun") -Recurse -Filter "wintun.dll" | Where-Object { $_.FullName -match "amd64" } | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName -Destination "$dest/wintun.dll" -Force }
          Get-ChildItem $dest

      - name: Build Tauri app
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Stage portable bundle (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.target }}/release/Mint.exe"
          if (-not (Test-Path $exe)) { Write-Error "Mint.exe not produced"; exit 1 }
          $stage = "stage/Mint"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path $exe -Destination "$stage/Mint.exe"
          # Sidecar + wintun.dll have to ship next to Mint.exe, otherwise
          # tauri-plugin-shell can't locate the sidecar at runtime and TUN
          # mode (next stage) will fail to load wintun.
          # Tauri's production sidecar resolution in `app.shell().sidecar("sing-box")`
          # looks for `sing-box.exe` (without the rust-target triple) next to
          # the main binary — that's also what the NSIS/MSI installers ship.
          # The suffixed name is only required by the Tauri *dev* pipeline.
          # The portable zip must mirror the installer layout, not the dev one.
          $sidecar = "src-tauri/binaries/sing-box-${{ matrix.target }}.exe"
          if (Test-Path $sidecar) { Copy-Item $sidecar "$stage/sing-box.exe" }
          $wintun = "src-tauri/binaries/wintun.dll"
          if (Test-Path $wintun) { Copy-Item $wintun "$stage/wintun.dll" }
          Compress-Archive -Path "$stage/*" -DestinationPath "Mint VPN-Windows-Portable-x64.zip" -Force

      - name: Upload portable
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-portable
          path: Mint VPN-Windows-Portable-x64.zip

      - name: Upload installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-installer
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
