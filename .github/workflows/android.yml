name: Android

on:
  push:
    branches: [main, dev, "feat/**"]
    tags:
      - "v*-android"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android (libbox + APK + AAB)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-android-cargo-

      - name: Cache go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-libbox-${{ hashFiles('scripts/build-libbox.sh') }}
          restore-keys: ${{ runner.os }}-go-libbox-

      - name: Cache libbox.aar
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: tauri-plugin-mintvpn/android/libs/libbox.aar
          # Bust whenever the build script changes (which contains the
          # sing-box version + tags).
          key: ${{ runner.os }}-libbox-aar-${{ hashFiles('scripts/build-libbox.sh') }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android NDK + platforms + build-tools
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build libbox.aar
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-libbox.sh

      - name: Verify libbox.aar present
        run: |
          if [ ! -s tauri-plugin-mintvpn/android/libs/libbox.aar ]; then
            echo "::error::libbox.aar is missing or empty"
            ls -la tauri-plugin-mintvpn/android/libs/ || true
            exit 1
          fi
          ls -la tauri-plugin-mintvpn/android/libs/

      - name: Install npm deps
        run: npm ci

      - name: Build APK (debug)
        run: npx --no-install @tauri-apps/cli android build --debug --apk

      - name: Locate APK
        id: apk
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          echo "Found APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mint-vpn-android-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build AAB (release, debug-signed)
        # We sign the release AAB with the bundled debug keystore so it
        # can be installed for sideload-testing. Replace MINT_ANDROID_*
        # secrets in repo settings to ship to Play Store.
        env:
          # If the user provides MINT_ANDROID_* repo secrets, the upstream
          # tauri keystore plumbing isn't wired yet — we just emit a debug
          # signed AAB. Phase 3 wires real keystore-from-secrets.
          KEYSTORE_BASE64: ${{ secrets.MINT_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.MINT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINT_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MINT_ANDROID_KEY_PASSWORD }}
        run: |
          npx --no-install @tauri-apps/cli android build --aab || true
          # The bundle build can fail when no release signing is configured
          # because tauri's android plugin requires a release keystore for
          # AAB bundling. The previous "|| true" lets the workflow continue
          # so we still upload the debug APK on PRs without secrets set.

      - name: Locate AAB
        id: aab
        run: |
          AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' 2>/dev/null | head -n1 || true)
          if [ -n "$AAB" ]; then
            echo "Found AAB: $AAB"
            echo "path=$AAB" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No AAB produced (release signing config likely missing)."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB artifact
        if: steps.aab.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mint-vpn-android-release-aab
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: warn
          retention-days: 14
